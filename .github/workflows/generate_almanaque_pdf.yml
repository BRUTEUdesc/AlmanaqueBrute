name: Gerar Almanaque PDF

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build_and_commit_pdf:
    if: "!contains(github.event.head_commit.message, 'chore: Atualiza o PDF')"

    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # A main exige o check "Formatting Check" para mergear. PRs abertos com o
      # GITHUB_TOKEN não disparam workflows, então o PR do PDF nunca receberia
      # esse check. Rodamos a verificação aqui e publicamos o status no commit do PR.
      - name: Run clang-format style check for C++ programs
        uses: jidicula/clang-format-action@v4.15.0
        with:
          clang-format-version: '20'
          check-path: 'Codigos'
          fallback-style: 'LLVM'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install LaTeX dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-portuguese \
            texlive-fonts-recommended \
            latexmk \
            lmodern \
            cm-super \
            rubber

      - name: Run PDF generation script
        run: python3 ./.github/scripts/pdfer.py

      - name: Create Pull Request com o novo PDF
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: Atualiza o PDF"

          title: "chore: Atualiza o PDF"
          body: |
            Este PR foi aberto automaticamente pelo GitHub Actions. 🤖

            O PDF do Almanaque foi atualizado para refletir as últimas mudanças nos códigos-fonte e/ou arquivos LaTeX.
          branch: "chore/gerar-pdf-${{ github.run_number }}"
          base: main
          delete-branch: true
          sign-commits: true

      - name: Marca o "Formatting Check" como aprovado no PR do PDF
        if: steps.cpr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context="Formatting Check" \
            -f description="clang-format verificado no workflow de geração do PDF"
